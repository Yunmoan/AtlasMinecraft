# Atlas server.properties (Minecraft Java 1.21.1 compatible keys)
# Other vanilla keys are currently ignored by Atlas.
server-ip=
server-port=25567
motd=Atlas Minecraft server
max-players=20
online-mode=true
view-distance=10
simulation-distance=10
level-name=world
level-seed=
# Atlas: preload a 7x7 spawn area; 0 workers selects automatically (up to 8).
spawn-preload-radius=3
chunk-generation-workers=0
