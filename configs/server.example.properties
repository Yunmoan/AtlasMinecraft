# Atlas server.properties (Minecraft Java 1.21.1 compatible keys)
# Other vanilla keys are currently ignored by Atlas.
server-ip=
server-port=25567
motd=Atlas Minecraft server
max-players=20
online-mode=true
view-distance=16
simulation-distance=10
level-name=world
level-seed=
# Atlas: radius 8 preloads 17x17 chunks; 0 workers selects automatically (up to 8).
spawn-preload-radius=8
chunk-generation-workers=0
